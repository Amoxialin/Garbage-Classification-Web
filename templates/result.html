<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>识别结果</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background-color: #f5f5f5; color: #333; }
        .container { max-width: 500px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);}
        h2 { color: #2c3e50; }
        img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .result, .datetime {
            font-size: 1.2em;
            margin-bottom: 12px;
        }
        .confidence {
            font-weight: bold;
            color: {% if confidence_float >= 80 %} #27ae60
                   {% elif confidence_float >= 50 %} #f39c12
                   {% else %} #e74c3c {% endif %};
            margin-bottom: 20px;
        }
        .top-preds h3 {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #34495e;
        }
        .top-preds ul {
            list-style: none;
            padding-left: 0;
        }
        .top-preds li {
            font-size: 1em;
            margin-bottom: 6px;
        }
        .back-btn {
            display: inline-block;
            padding: 8px 18px;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        .back-btn:hover { background-color: #2980b9; }
        @media (max-width: 600px) {
            .container {
                margin: 20px 10px;
                padding: 15px;
            }
            h2 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>识别结果</h2>
        <!-- 上传图片展示区域 动态生成图片URL：从Flask静态目录加载上传文件 -->
        <img src="{{ url_for('static', filename='uploads/' + filename) }}" alt="上传图片">
        <div class="result">识别类别：<strong>{{ pred_class }}</strong></div> <!-- 主要预测结果展示 -->
        <div class="confidence">置信度：{{ confidence }}</div>
        <div class="datetime">识别时间：{{ datetime }}</div> <!-- 标准化时间格式 -->
        <!-- 备选预测结果（当存在top_preds时显示） -->
        {% if top_preds %}
        <div class="top-preds">
            <h3>其他可能类别</h3>
            <!-- 循环渲染备选结果列表项 每个条目显示：类别名称 + 置信度百分比 -->
            <ul>
                {% for item in top_preds %}
                    <li>{{ item.class_name }}: {{ item.confidence }}%</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
         <!-- 返回按钮（链接到首页路由） -->
        <a href="{{ url_for('index') }}" class="back-btn">返回上传</a>
    </div>
</body>
</html>
